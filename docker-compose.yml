services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: paddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paddy
      POSTGRES_PASSWORD: paddy
      POSTGRES_DB: paddy
    ports:
      - "5432:5432"
    volumes:
      - paddy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paddy -d paddy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: paddy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - paddy_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  paddy_pgdata:
  paddy_redis:
