# Coolify compose for Paddy (no Caddy — Coolify Traefik terminates TLS).
# In Coolify: Docker Compose → this file → map domain to service `web` port 3000.
# Required env: POSTGRES_PASSWORD, APP_URL (https://your.domain), AUTH_SECRET,
# plus AI_* and RESEND_API_KEY (or SMTP_*) for chat/email.

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-paddy}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-paddy}?schema=public
  REDIS_URL: redis://redis:6379
  APP_URL: ${APP_URL:?set APP_URL (https://your-domain)}
  AI_PROVIDER: ${AI_PROVIDER:-openai}
  AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
  AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  NODE_ENV: production

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-paddy}
    volumes:
      - paddy_pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paddy} -d ${POSTGRES_DB:-paddy}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - paddy_redis:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # One-shot: applies prisma/migrations (incl. CREATE EXTENSION vector) then exits.
  migrate:
    image: paddy-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Coolify Traefik reaches this port; no host publish needed on Coolify.
    expose:
      - "3000"
    networks:
      - internal
      - egress
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    image: paddy-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_POLL_MS: ${WORKER_POLL_MS:-15000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - internal
      - egress


volumes:
  paddy_pgdata:
  paddy_redis:

networks:
  internal:
    internal: true
  egress: {}
  # Coolify's proxy network — Traefik reaches `web:3000` through this.
  coolify:
    external: true
