# Coolify compose for Paddy — PostgreSQL is a Coolify *database service* (not in this file).
# Traefik terminates TLS; map your domain to service `web` port 3000.
#
# 1) In Coolify: New Resource → Database → PostgreSQL
#    Image MUST be: pgvector/pgvector:pg17  (plain postgres lacks `vector`)
#    Create DB/user (e.g. paddy / strong password). Copy the generated DATABASE_URL.
# 2) This app: Docker Compose → this file. Paste DATABASE_URL (or link the DB resource).
# 3) Also set: AUTH_SECRET, APP_URL=https://your-domain, AI_*, EMAIL_FROM + RESEND/SMTP.
#
# App containers join the external `coolify` network so they can reach the DB service by hostname.

x-app-env: &app-env
  # Prefer the URL Coolify injects when you link a PostgreSQL resource.
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL from Coolify PostgreSQL service}
  REDIS_URL: redis://redis:6379
  APP_URL: ${APP_URL:?set APP_URL (https://your-domain)}
  AI_PROVIDER: ${AI_PROVIDER:-openai}
  AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
  AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
  # RunPod cold starts can be slow; Paddy reports a timeout instead of "offline".
  AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-120000}
  AI_MAX_RETRIES: ${AI_MAX_RETRIES:-1}
  # 502-504 retries can double-bill RunPod; opt in with true.
  AI_RETRY_HTTP: ${AI_RETRY_HTTP:-false}
  # Memory extraction runs in the worker once a chat goes quiet (never per message).
  MEMORY_EXTRACTION: ${MEMORY_EXTRACTION:-idle}
  MEMORY_IDLE_MINUTES: ${MEMORY_IDLE_MINUTES:-10}
  MEMORY_MIN_USER_MESSAGES: ${MEMORY_MIN_USER_MESSAGES:-3}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  NODE_ENV: production
  NODE_OPTIONS: ${NODE_OPTIONS:---dns-result-order=ipv4first}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - paddy_redis:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # One-shot: prisma migrate deploy (incl. CREATE EXTENSION vector) then exits.
  migrate:
    image: paddy-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker
    user: "0:0"
    command: ["sh", "./scripts/migrate.sh"]
    environment:
      <<: *app-env
    networks:
      - internal
      - coolify
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - internal
      - egress
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    image: paddy-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_POLL_MS: ${WORKER_POLL_MS:-15000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - internal
      - egress
      - coolify

volumes:
  paddy_redis:

networks:
  internal:
    internal: true
    enable_ipv6: false
  egress: {}
  coolify:
    external: true
